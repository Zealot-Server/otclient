name: CI

on:
  workflow_dispatch:
    inputs:
      windows_smoke_only:
        description: Re-test an existing Windows release package without rebuilding
        required: false
        default: false
        type: boolean
      source_run_id:
        description: CI run containing the Windows package
        required: false
        type: string
      source_sha:
        description: Commit SHA of the packaged Windows artifact
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "tests/**"
      - "cmake/**"
      - "android/**"
      - "browser/**"
      - "data/**"
      - "mods/**"
      - "modules/**"
      - "tools/**"
      - "vc18/**"
      - "vcpkg.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "Dockerfile"
      - "Dockerfile.browser"
      - "Dockerfile.browser.sh"
      - "build_luajit_android.sh"
      - "setup_android_deps.sh"
      - "init.lua"
      - "otclientrc.lua"
      - "cacert.pem"
      - "config.ini"
      - ".dockerignore"
      - ".yamllint.yaml"
      - ".reviewdog.yml"
      - ".github/workflows/**"
  merge_group:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "cmake/**"
      - "android/**"
      - "browser/**"
      - "data/**"
      - "mods/**"
      - "modules/**"
      - "tools/**"
      - "vc18/**"
      - "vcpkg.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "Dockerfile"
      - "Dockerfile.browser"
      - "Dockerfile.browser.sh"
      - "build_luajit_android.sh"
      - "setup_android_deps.sh"
      - "init.lua"
      - "otclientrc.lua"
      - "cacert.pem"
      - "config.ini"
      - ".dockerignore"
      - ".yamllint.yaml"
      - ".reviewdog.yml"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Build Scope
    if: ${{ !inputs.windows_smoke_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      compile: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && 'true' || steps.filter.outputs.compile }}
      macos: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && 'true' || steps.filter.outputs.macos }}
      android: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && 'true' || steps.filter.outputs.android }}
      docker: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && 'true' || steps.filter.outputs.docker }}
      browser: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && 'true' || steps.filter.outputs.browser }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'merge_group'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        with:
          filters: |
            compile:
              - "src/**"
              - "tests/**"
              - "cmake/**"
              - "vc18/**"
              - "data/**"
              - "mods/**"
              - "modules/**"
              - "tools/e2e/**"
              - "vcpkg.json"
              - "CMakeLists.txt"
              - "CMakePresets.json"
              - "init.lua"
              - "otclientrc.lua"
              - "cacert.pem"
              - "config.ini"
              - ".yamllint.yaml"
              - ".reviewdog.yml"
              - ".github/workflows/ci.yml"
              - ".github/workflows/reusable-build-linux.yml"
              - ".github/workflows/reusable-build-windows.yml"
              - ".github/workflows/reusable-checks.yml"
              - ".github/workflows/reusable-tests-lua.yml"
            macos:
              - "src/**"
              - "cmake/**"
              - "data/**"
              - "mods/**"
              - "modules/**"
              - "tools/e2e/**"
              - "vcpkg.json"
              - "CMakeLists.txt"
              - "CMakePresets.json"
              - "init.lua"
              - "otclientrc.lua"
              - "cacert.pem"
              - "config.ini"
              - ".github/workflows/ci.yml"
              - ".github/workflows/reusable-build-macos.yml"
            android:
              - "src/**"
              - "android/**"
              - "cmake/**"
              - "CMakeLists.txt"
              - "vcpkg.json"
              - "build_luajit_android.sh"
              - "setup_android_deps.sh"
              - ".github/workflows/ci.yml"
              - ".github/workflows/reusable-build-android-apk.yml"
            docker:
              - "Dockerfile"
              - ".dockerignore"
              - "src/**"
              - "cmake/**"
              - "vcpkg.json"
              - "CMakeLists.txt"
              - "CMakePresets.json"
              - ".yamllint.yaml"
              - ".github/workflows/ci.yml"
              - ".github/workflows/reusable-build-docker.yml"
            browser:
              - "Dockerfile.browser"
              - "Dockerfile.browser.sh"
              - "browser/**"
              - "src/**"
              - "cmake/**"
              - "vcpkg.json"
              - "CMakeLists.txt"
              - ".yamllint.yaml"
              - ".github/workflows/ci.yml"
              - ".github/workflows/reusable-build-browser.yml"

  checks:
    name: Fast Checks
    if: (!inputs.windows_smoke_only) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      checks: write
      pull-requests: read
    uses: ./.github/workflows/reusable-checks.yml
    secrets: inherit

  tests-lua:
    name: Lua Syntax
    if: (!inputs.windows_smoke_only) && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-tests-lua.yml
    secrets: inherit

  build-linux:
    name: Build - Linux
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.compile == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-build-linux.yml
    secrets: inherit

  build-windows:
    name: Build - Windows
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.compile == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-build-windows.yml
    secrets: inherit

  build-macos:
    name: Build - macOS
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.macos == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-build-macos.yml
    secrets: inherit

  build-android-apk:
    name: Build - Android APK
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.android == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-build-android-apk.yml
    secrets: inherit

  build-docker:
    name: Build - Docker
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.docker == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-build-docker.yml
    with:
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      vcpkg_binary_cache_access: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'readwrite' || 'read' }}
    secrets: inherit

  build-browser:
    name: Build - Browser
    needs: [changes, checks, tests-lua]
    if: needs.changes.outputs.browser == 'true' && needs.checks.result == 'success' && needs.tests-lua.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-build-browser.yml
    secrets: inherit

  release-e2e:
    name: Release E2E - ${{ matrix.name }}
    needs: [build-linux, build-windows, build-macos]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            artifact: linux-x86_64
            archive: linux
          - name: Windows x86_64
            os: windows-2025
            artifact: windows-x86_64
            archive: windows
          - name: macOS Apple Silicon
            os: macos-15
            artifact: macos-arm64
            archive: macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-x86_64
            archive: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download packaged client
        uses: actions/download-artifact@v4
        with:
          name: zealot-client-${{ matrix.artifact }}-${{ github.sha }}
          path: client-package

      - name: Download Windows debug symbols
        if: matrix.archive == 'windows'
        uses: actions/download-artifact@v4
        with:
          name: windows-cmake-release
          path: windows-symbols

      - name: Smoke test Linux release login
        if: matrix.archive == 'linux'
        shell: bash
        env:
          ZEALOT_E2E_ACCOUNT: ${{ secrets.ZEALOT_E2E_ACCOUNT }}
          ZEALOT_E2E_PASSWORD: ${{ secrets.ZEALOT_E2E_PASSWORD }}
          ZEALOT_E2E_CHARACTER: ${{ secrets.ZEALOT_E2E_CHARACTER }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils libgl1 libgl1-mesa-dri libx11-6 libxext6 libxrandr2 libxi6 libxcursor1 libxinerama1 libasound2t64 imagemagick
          archive=$(find client-package -name '*-linux-x86_64.tar.gz' -print -quit)
          test -n "${archive}"
          mkdir client-runtime
          tar -xzf "${archive}" -C client-runtime
          init_file=$(find client-runtime -mindepth 2 -maxdepth 2 -name init.lua -type f -print -quit)
          test -n "${init_file}"
          runtime_root=$(dirname "${init_file}")
          python3 tools/e2e/prepare_client_smoke.py --runtime-root "${runtime_root}"
          cd "${runtime_root}"
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 > xvfb.log 2>&1 &
          xvfb_pid=$!
          sleep 2
          xdpyinfo -display :99 >/dev/null
          ./run-zealot-client.sh > client-e2e.log 2>&1 &
          client_pid=$!
          set +e
          python3 "${GITHUB_WORKSPACE}/tools/e2e/wait_for_client_smoke.py" --result zealot-e2e-result.txt --timeout 500
          status=$?
          if [ "${status}" -ne 0 ]; then
            import -window root client-e2e-failure.png || true
          fi
          kill "${client_pid}" 2>/dev/null || true
          kill "${xvfb_pid}" 2>/dev/null || true
          wait "${client_pid}" 2>/dev/null || true
          wait "${xvfb_pid}" 2>/dev/null || true
          exit "${status}"

      - name: Install software OpenGL for headless Windows runner
        if: matrix.archive == 'windows'
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -Sy --noconfirm mingw-w64-ucrt-x86_64-mesa'
          if ($LASTEXITCODE -ne 0) { throw "MSYS2 Mesa installation failed with code $LASTEXITCODE" }
          foreach ($file in @('opengl32.dll', 'libgallium_wgl.dll')) {
            if (!(Test-Path "C:\msys64\ucrt64\bin\$file")) { throw "Mesa is missing $file" }
          }

      - name: Smoke test Windows release login
        if: matrix.archive == 'windows'
        shell: pwsh
        env:
          ZEALOT_E2E_ACCOUNT: ${{ secrets.ZEALOT_E2E_ACCOUNT }}
          ZEALOT_E2E_PASSWORD: ${{ secrets.ZEALOT_E2E_PASSWORD }}
          ZEALOT_E2E_CHARACTER: ${{ secrets.ZEALOT_E2E_CHARACTER }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Get-ChildItem -Path client-package -Filter '*-windows-x86_64.zip' -File | Select-Object -First 1
          if ($null -eq $archive) { throw 'Windows release archive was not downloaded.' }
          Expand-Archive -Path $archive.FullName -DestinationPath client-runtime
          $runtimeRoot = Join-Path (Get-Location) 'client-runtime/Zealot Client'
          Copy-Item -Path windows-symbols/otclient.pdb -Destination (Join-Path $runtimeRoot 'otclient.pdb')
          Copy-Item 'C:\msys64\ucrt64\bin\opengl32.dll' -Destination $runtimeRoot
          Copy-Item 'C:\msys64\ucrt64\bin\libgallium_wgl.dll' -Destination $runtimeRoot
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          $env:GALLIUM_DRIVER = 'llvmpipe'
          python tools/e2e/prepare_client_smoke.py --runtime-root $runtimeRoot
          $client = Start-Process -FilePath (Join-Path $runtimeRoot 'Zealot Client.exe') -WorkingDirectory $runtimeRoot -PassThru -RedirectStandardOutput (Join-Path $runtimeRoot 'client-e2e.stdout.log') -RedirectStandardError (Join-Path $runtimeRoot 'client-e2e.stderr.log')
          try {
            Start-Sleep -Seconds 10
            $client.Refresh()
            if ($client.HasExited) { throw "Client exited before smoke test completed with code $($client.ExitCode)" }
            python tools/e2e/wait_for_client_smoke.py --result (Join-Path $runtimeRoot 'zealot-e2e-result.txt') --timeout 500
            if ($LASTEXITCODE -ne 0) { throw "Client smoke test failed with exit code $LASTEXITCODE" }
          }
          catch {
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-10) } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in @('Application Error', 'Windows Error Reporting') -and $_.Message -match 'Zealot Client' } |
              Select-Object -First 10 TimeCreated, ProviderName, Id, Message |
              Format-List |
              Out-File -FilePath (Join-Path $runtimeRoot 'client-e2e.windows-events.log')
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bitmap = New-Object System.Drawing.Bitmap([System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width, [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen(0, 0, 0, 0, $bitmap.Size)
            $bitmap.Save((Join-Path $runtimeRoot 'client-e2e-failure.png'))
            throw
          }
          finally {
            if (!$client.HasExited) { Stop-Process -Id $client.Id -Force }
          }

      - name: Smoke test macOS release login
        if: startsWith(matrix.archive, 'macos-')
        shell: bash
        env:
          ZEALOT_E2E_ACCOUNT: ${{ secrets.ZEALOT_E2E_ACCOUNT }}
          ZEALOT_E2E_PASSWORD: ${{ secrets.ZEALOT_E2E_PASSWORD }}
          ZEALOT_E2E_CHARACTER: ${{ secrets.ZEALOT_E2E_CHARACTER }}
        run: |
          set -euo pipefail
          architecture="${{ matrix.archive == 'macos-arm64' && 'arm64' || 'x86_64' }}"
          archive=$(find client-package -name "*-macos-${architecture}.zip" -print -quit)
          test -n "${archive}"
          mkdir client-runtime
          ditto -x -k "${archive}" client-runtime
          runtime_root="${GITHUB_WORKSPACE}/client-runtime/Zealot Client.app/Contents/Resources"
          python3 tools/e2e/prepare_client_smoke.py --runtime-root "${runtime_root}"
          cd "${runtime_root}"
          "../MacOS/Zealot Client" > client-e2e.log 2>&1 &
          client_pid=$!
          set +e
          python3 "${GITHUB_WORKSPACE}/tools/e2e/wait_for_client_smoke.py" --result zealot-e2e-result.txt --timeout 500
          status=$?
          if [ "${status}" -ne 0 ]; then
            screencapture -x client-e2e-failure.png || true
          fi
          kill "${client_pid}" 2>/dev/null || true
          wait "${client_pid}" 2>/dev/null || true
          exit "${status}"

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-release-e2e-${{ matrix.archive }}-${{ github.sha }}
          path: |
            client-runtime/**/client-e2e.log
            client-runtime/**/client-e2e.stdout.log
            client-runtime/**/client-e2e.stderr.log
            client-runtime/**/client-e2e.windows-events.log
            client-runtime/**/crashreport.log
            client-runtime/**/otclient.log
            client-runtime/**/xvfb.log
            client-runtime/**/zealot-e2e-result.txt
            client-runtime/**/client-e2e-failure.png
          if-no-files-found: ignore

  windows-smoke-retest:
    name: Windows package re-test without rebuild
    if: github.event_name == 'workflow_dispatch' && inputs.windows_smoke_only
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-windows-smoke.yml
    with:
      source_run_id: ${{ inputs.source_run_id }}
      source_sha: ${{ inputs.source_sha }}
    secrets: inherit
